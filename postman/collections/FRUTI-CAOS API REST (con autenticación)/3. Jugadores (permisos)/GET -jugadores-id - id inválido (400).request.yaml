$kind: http-request
name: GET /jugadores/:id - id inválido (400)
url: "{{baseUrl}}/jugadores/abc"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 400", function () { pm.response.to.have.status(400); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      pm.test("Trae el campo error", function () { pm.expect(pm.response.json()).to.have.property("error"); });
    language: text/javascript
order: 6000
