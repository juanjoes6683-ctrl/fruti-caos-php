$kind: http-request
name: POST /auth/login - jugador 1 (200)
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"tag": "{{tagUnico}}", "password": "{{password}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      var r = pm.response.json();
      pm.collectionVariables.set("token", r.token);
      pm.test("Devuelve token Bearer y jugador", function () { pm.expect(r.token).to.be.a("string"); pm.expect(r.tipo).to.eql("Bearer"); pm.expect(r.jugador.id).to.exist; });
      pm.test("Nunca devuelve el hash de la contraseña", function () { pm.expect(pm.response.text()).to.not.include("password_hash"); });
    language: text/javascript
order: 4000
