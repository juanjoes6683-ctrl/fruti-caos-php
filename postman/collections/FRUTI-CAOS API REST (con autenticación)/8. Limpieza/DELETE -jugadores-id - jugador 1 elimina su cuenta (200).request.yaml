$kind: http-request
name: DELETE /jugadores/:id - jugador 1 elimina su cuenta (200)
url: "{{baseUrl}}/jugadores/{{jugadorId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 4000
