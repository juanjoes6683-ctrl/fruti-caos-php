$kind: http-request
name: POST /auth/login - jugador 2 (200)
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{"tag": "{{tagUnico2}}", "password": "{{password}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      var r = pm.response.json();
      pm.collectionVariables.set("token2", r.token);
    language: text/javascript
order: 1000
