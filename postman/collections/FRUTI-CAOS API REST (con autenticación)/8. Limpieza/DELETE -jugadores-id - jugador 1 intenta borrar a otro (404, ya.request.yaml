$kind: http-request
name: DELETE /jugadores/:id - jugador 1 intenta borrar a otro (404, ya no existe)
url: "{{baseUrl}}/jugadores/{{jugadorId2}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 404", function () { pm.response.to.have.status(404); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      pm.test("Trae el campo error", function () { pm.expect(pm.response.json()).to.have.property("error"); });
    language: text/javascript
order: 3000
