$kind: http-request
name: DELETE /partidas/:id - jugador común (403, solo admin)
url: "{{baseUrl}}/partidas/{{partidaId}}"
method: DELETE
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 403", function () { pm.response.to.have.status(403); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      pm.test("Trae el campo error", function () { pm.expect(pm.response.json()).to.have.property("error"); });
    language: text/javascript
order: 13000
