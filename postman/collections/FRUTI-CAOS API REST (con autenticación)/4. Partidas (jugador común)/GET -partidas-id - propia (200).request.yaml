$kind: http-request
name: GET /partidas/:id - propia (200)
url: "{{baseUrl}}/partidas/{{partidaId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
    language: text/javascript
order: 9000
