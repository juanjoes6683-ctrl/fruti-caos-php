$kind: http-request
name: PUT /partidas/:id - admin reemplaza (200)
url: "{{baseUrl}}/partidas/{{partidaId}}"
method: PUT
headers:
  Authorization: Bearer {{tokenAdmin}}
  Content-Type: application/json
body:
  type: json
  content: '{"puntaje": 5000, "nivel_jugo": 2, "resultado": "jugo"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      pm.test("El puntaje cambió", function () { pm.expect(pm.response.json().puntaje).to.eql(5000); });
    language: text/javascript
order: 4000
