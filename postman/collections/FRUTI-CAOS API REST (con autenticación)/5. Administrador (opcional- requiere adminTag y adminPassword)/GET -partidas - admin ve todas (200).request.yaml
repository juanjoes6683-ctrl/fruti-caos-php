$kind: http-request
name: GET /partidas - admin ve todas (200)
url: "{{baseUrl}}/partidas"
method: GET
headers:
  Authorization: Bearer {{tokenAdmin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      pm.test("Devuelve un array", function () { pm.expect(pm.response.json()).to.be.an("array"); });
    language: text/javascript
order: 3000
