$kind: http-request
name: GET /jugadores - admin (200)
url: "{{baseUrl}}/jugadores"
method: GET
headers:
  Authorization: Bearer {{tokenAdmin}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      pm.test("Devuelve un array", function () { pm.expect(pm.response.json()).to.be.an("array"); });
      pm.test("Nunca devuelve el hash de la contraseña", function () { pm.expect(pm.response.text()).to.not.include("password_hash"); });
    language: text/javascript
order: 2000
