$kind: http-request
name: GET /ranking?limite=3 (200)
url: "{{baseUrl}}/ranking?limite=3"
method: GET
queryParams:
  limite: "3"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      pm.test("Máximo 3 filas", function () { pm.expect(pm.response.json().length).to.be.at.most(3); });
    language: text/javascript
order: 2000
