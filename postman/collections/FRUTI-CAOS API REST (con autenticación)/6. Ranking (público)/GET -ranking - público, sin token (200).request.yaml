$kind: http-request
name: GET /ranking - público, sin token (200)
url: "{{baseUrl}}/ranking"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Código HTTP 200", function () { pm.response.to.have.status(200); });
      pm.test("Responde JSON", function () { pm.response.to.be.json; });
      pm.test("Devuelve un array", function () { pm.expect(pm.response.json()).to.be.an("array"); });
      pm.test("Máximo 10 filas", function () { pm.expect(pm.response.json().length).to.be.at.most(10); });
    language: text/javascript
order: 1000
